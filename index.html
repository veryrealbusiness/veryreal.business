<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Very Real Services - Subscription</title>
<style>
  body {
    font-family: sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    background-color: #f9f9f9;
  }
  .subscription-card {
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 30px;
    max-width: 400px;
    text-align: center;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
  }
  .logo {
    max-width: 200px;
    margin-bottom: 20px;
  }
  .price {
    font-size: 1.5em;
    font-weight: bold;
    color: #333;
    margin: 15px 0;
  }
  .quantity-selector {
    margin: 20px 0;
  }
  .quantity-selector input {
    width: 60px;
    padding: 5px;
    text-align: center;
    margin-left: 10px;
  }
  .contact-info {
    margin-top: 25px;
    font-size: 0.9em;
    color: #666;
  }
  .contact-info a {
    color: #0056b3;
    text-decoration: none;
  }
</style>
</head>
<body>

<div class="subscription-card">
  <img src="image.jpg" alt="Very Real Business Logo" class="logo">
  
  <h2>Very Real Services</h2>
  <p>Very Real Business</p>
  
  <div class="price">$10.75 / period</div>

  <div class="quantity-selector">
    <label for="quantity">Number of Subscriptions:</label>
    <input type="number" id="quantity" name="quantity" min="1" value="1">
  </div>

  <!-- PayPal Smart Button Container -->
  <div id="paypal-button-container"></div>

  <div class="contact-info">
    Questions? Contact us at: <br>
    <a href="mailto:billing@veryreal.business">billing@veryreal.business</a>
  </div>
</div>

<!-- Replace 'YOUR_CLIENT_ID' with your PayPal App Client ID -->
<script src="https://www.paypal.com/sdk/js?client-id=YOUR_CLIENT_ID&vault=true&intent=subscription"></script>
<script>
  paypal.Buttons({
    createSubscription: function(data, actions) {
      // Replace 'YOUR_PLAN_ID' with the Plan ID generated in your PayPal dashboard
      return actions.subscription.create({
        'plan_id': 'YOUR_PLAN_ID',
        'quantity': document.getElementById('quantity').value
      });
    },
    onApprove: function(data, actions) {
      alert('Subscription successful!');
    }
  }).render('#paypal-button-container');
</script>

</body>
</html>
